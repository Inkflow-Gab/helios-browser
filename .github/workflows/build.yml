name: Build Helios Browser APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adblock-engine:
    name: Build native adblock engine
    runs-on: ubuntu-latest

    # The Rust library is a separate job so its long cold compile, and its failure, are reported
    # separately from Gradle's. `build` needs it, so a red engine build blocks the APK rather than
    # silently shipping one with no ad blocking.
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Pinned to match native/helios-adblock/rust-toolchain.toml. The crate's file is the source of
      # truth once cargo runs inside it; this keeps the *installed* toolchain honest for the
      # `cargo install cargo-ndk` step that runs before any crate directory is entered.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      # The NDK is not used to build anything directly. cargo-ndk needs it to supply the linker and
      # the sysroot for each Android target.
      #
      # `ndk-version` must be the *alias* (`r27c`), not the revision. `nttld/setup-ndk` does no
      # alias resolution: it builds the URL as `android-ndk-<version>-linux.zip` verbatim, so
      # passing `27.2.12479018` requests a file that does not exist and 404s. It also derives the
      # host-arch suffix by parsing `version.slice(1)`, which is only meaningful for an alias
      # starting with `r`. `r27c` is revision 27.2.12479018.
      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # cargo-ndk supplies the linker, the sysroot and the CC wrapper, but it does *not* install
      # Rust's standard library for the target — that comes from rustup. Without this every target
      # build dies at `can't find crate for core`.
      #
      # The triples are the Rust names for the Android ABIs, which is why the list does not match the
      # `-t` flags below one-for-one in spelling:
      #   arm64-v8a   -> aarch64-linux-android
      #   armeabi-v7a -> armv7-linux-androideabi
      #   x86_64      -> x86_64-linux-android
      - name: Add Android Rust targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android
          rustup target list --installed

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/helios-adblock/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/helios-adblock/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build libhelios_adblock.so for every ABI
        working-directory: native/helios-adblock
        env:
          # cargo-ndk reads this path for the linker and sysroot. It does not fall back to
          # ANDROID_HOME here, so the variable has to be set explicitly.
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # x86_64 is built so the APK runs on emulators; arm64-v8a is what real phones use.
        # armeabi-v7a is kept for old 32-bit devices.
        #
        # `-o` is the output directory, and cargo-ndk writes the `<abi>/lib*.so` layout Android
        # expects — so this lands directly in `app/src/jniLibs` with no Gradle native config.
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o "$GITHUB_WORKSPACE/app/src/jniLibs" \
            build --release
          find "$GITHUB_WORKSPACE/app/src/jniLibs" -name '*.so' -exec ls -lh {} +

      # Printed rather than captured as an output: nothing downstream consumes it, and a checksum
      # in the log is enough to tell two CI builds of the same commit apart.
      - name: Record what was built
        working-directory: app/src/jniLibs
        run: sha256sum */*.so

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: helios-jniLibs
          path: app/src/jniLibs/
          retention-days: 7
          if-no-files-found: error

  rust-tests:
    name: Test adblock-rust integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      # These cover the JNI layer's own logic: $third-party scoping, @@ exceptions, $domain=,
      # cosmetic selectors, generic hiding and the serialise round trip. They are the only tests
      # that exercise the blocking rules, since AdBlockEngineTest cannot call into the library.
      - name: Run cargo test
        working-directory: native/helios-adblock
        run: cargo test --release

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [ adblock-engine, rust-tests ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: helios-jniLibs
          path: app/src/jniLibs

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # A build with no `.so` still compiles and still ships — Helios falls back to a small
      # compiled-in host list — but it is not what was asked for, so this fails loudly instead.
      - name: Verify native libraries are present
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "app/src/jniLibs/$abi/libhelios_adblock.so" \
              || { echo "missing libhelios_adblock.so for $abi"; exit 1; }
          done

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helios-Browser-Beta
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
